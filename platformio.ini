[platformio]
default_envs = native_modbus_tests

[env:native_modbus_tests]
platform = native
test_framework = unity
test_build_src = no
test_filter = test_modbus_rtu_slave_characterization
build_flags =
    -std=gnu++17
    -I ${PROJECT_DIR}/src
    -I ${PROJECT_DIR}/test/support
    -DOGM_BRIDGE_MODE
    -DOGM_USE_MUTEX
    -DOGM_MODBUS_MT_ACCESSORS
    -DUSB_DEBUG
    -DBRIDGE_UPSTREAM_TX_DIAG=1
