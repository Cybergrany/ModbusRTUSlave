[platformio]
default_envs = native_modbus_tests

[env:native_modbus_tests]
platform = native
test_framework = unity
test_build_src = no
test_filter = test_modbus_rtu_slave_characterization
build_flags =
    -std=gnu++17
    -I ${PROJECT_DIR}/src
    -I ${PROJECT_DIR}/test/support
    -DMBUS_RTU_SLAVE_BRIDGE_MODE
    -DMBUS_RTU_SLAVE_USE_MUTEX
    -DMBUS_RTU_SLAVE_MUTEX_HEADER=\"platform/PlatformLock.h\"
    -DMBUS_RTU_SLAVE_WORK_ACCESSORS
    -DMBUS_RTU_SLAVE_DIAGNOSTICS
    -DMBUS_RTU_SLAVE_EVENT_CALLBACKS
    -DMBUS_RTU_SLAVE_BRIDGE_TX_DIAGNOSTICS=1
